<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Whitechapel Files — Retro Terminal</title>
<style>
  :root{
    --bg:#0d1b14;
    --fg:#7aff9b;
    --dim:#4bd17a;
    --muted:#2b6a46;
    --accent:#9cffb3;
  }
  html,body{height:100%}
  body{
    margin:0;
    background: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Mono","Courier New",monospace;
    line-height:1.6;
    overflow-x:hidden;
  }
  /* CRT scanlines + subtle noise */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 2px, transparent 4px),
      radial-gradient(ellipse at center, rgba(255,255,255,.04) 0%, transparent 60%);
    mix-blend-mode: overlay;
    pointer-events:none;
  }
  .wrap{
    max-width: 920px;
    margin: 40px auto;
    padding: 0 16px;
  }
  .term{
    border: 1px solid var(--muted);
    padding: 20px;
    box-shadow: 0 0 24px rgba(124,255,155,.08), inset 0 0 24px rgba(124,255,155,.08);
    position: relative;
    min-height: 260px;
  }
  .hdr{
    color: var(--accent);
    margin-bottom: 12px;
  }
  .mono{font-family: inherit; white-space: pre-wrap;}
  .files{margin: 8px 0 0 0; padding:0; list-style:none}
  .file{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; margin:6px 0;
    background: rgba(124,255,155,.05);
    border: 1px solid var(--muted);
    cursor:pointer; user-select:none;
    transition: filter .12s ease, background .12s ease, transform .04s ease;
  }
  .file:hover{filter: brightness(1.15); background: rgba(124,255,155,.08);}
  .file:active{transform: translateY(1px);}
  .file .tag{color: var(--accent); min-width: 40px;}
  .file .name{flex:1;}
  .file .status{color: var(--dim)}
  .muted{color: var(--dim)}
  .help{color: var(--dim); margin-top: 10px; font-size: 0.95rem}
  .blink{
    display:inline-block; width:10px; height:1.2em; vertical-align:baseline; background: var(--fg);
    animation: blink 1s steps(1,end) infinite; margin-left:4px;
  }
  @keyframes blink{50%{opacity:0}}
  .accessing{
    position: absolute; inset:0; display:none; align-items:center; justify-content:center;
    background: rgba(13,27,20,.9); backdrop-filter: blur(2px);
    color: var(--accent); font-weight: 600;
  }
  .accessing.active{display:flex;}
  .btn{
    display:inline-block; margin-top:10px; padding:8px 12px;
    border:1px solid var(--muted); background: rgba(124,255,155,.06);
    color: var(--fg); text-decoration:none; cursor:pointer;
    font-family: inherit;
  }
  .btn:hover{filter: brightness(1.15)}
  .btn-row{margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;}
  .btn.secondary{background: transparent; color: var(--dim);}
  .log-title{color: var(--accent); margin-bottom: 8px}
  .log-lines{min-height: 160px; border: 1px dashed var(--muted); padding: 12px;}
  .overlay{
    position: fixed; inset:0; background: rgba(13,27,20,.96);
    color: var(--fg); display:none; align-items:center; justify-content:center; z-index: 10;
    animation: fadeIn .35s ease;
  }
  .overlay.show{display:flex;}
  .overlay .box{
    border:1px solid var(--muted); padding:20px; max-width:720px; margin:16px;
    box-shadow: 0 0 24px rgba(124,255,155,.1), inset 0 0 20px rgba(124,255,155,.08);
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .kbd{border:1px solid var(--muted); padding:2px 6px; font-size:.95em}
  .footer{margin-top: 14px; color: var(--dim); font-size: .9rem}
  .clues{
    margin-top: 18px;
    border-top:1px dashed var(--muted);
    padding-top:10px;
  }
  .clues-title{color:var(--accent); margin-bottom:4px;}
  .clue-item{color:var(--dim); font-size:0.95rem; margin:2px 0;}
  .msg{color:#ffb37a; font-size:0.9rem; margin-top:6px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="term" id="app">
      <div class="accessing" id="accessing"></div>
    </div>
  </div>

  <!-- Ending overlay -->
  <div class="overlay" id="ending">
    <div class="box mono" id="endingBox"></div>
  </div>

  <!-- Accuse overlay -->
  <div class="overlay" id="accuseOverlay">
    <div class="box mono" id="accuseBox">
      <div>> Select suspect to accuse:</div>
      <div class="btn-row">
        <button class="btn" id="accuseReporter">Reporter Aiden</button>
        <button class="btn secondary" id="accuseUnknown">Someone else / Not sure</button>
      </div>
      <div class="msg" id="accuseHint"></div>
    </div>
  </div>

<script>
/* =========================
   DATA
========================= */
const DATA = {
  ui: {
    title: "LONDON POLICE ARCHIVE SYSTEM",
    subtitle: "CASE FILE: WHITECHAPEL_1888",
    status: "STATUS: RESTORED",
    prompt: "3 AUDIO LOGS AVAILABLE",
    select: "Select file to playback:",
    accessing: "Accessing file...",
    back: "Return to file list",
    complete: "All audio fragments restored.",
    crossref: "Cross reference complete.",
    suspect: "Primary suspect identified: REPORTER_AIDEN.",
    closed: "Case File: CLOSED.",
    help: "Click a file to play. Press Esc to return. Read the clues, then decide who you want to accuse."
  },
  files: [
    {
      id: "A",
      name: "Detective_Log.wav",
      lines: [
        ""Record time: 3:05 a.m."",
        ""Female victim found against the wall."",
        ""Ground surface is dry."",
        ""A reporter is on scene,"",
        ""He claims he discovered the body at 2:55.""
      ],
      clue: "Clue A: When the detective arrives at 3:05, the ground is dry — but the reporter says it was still raining at 2:55."
    },
    {
      id: "B",
      name: "Reporter_Record.wav",
      lines: [
        ""2:55 a.m."",
        ""Whitechapel alley, near the wall."",
        ""The woman was already down when I arrived."",
        ""My shoes are wet — it was raining.""
      ],
      clue: "Clue B: The reporter says he found the body at 2:55, ten minutes before the detective."
    },
    {
      id: "C",
      name: "Witness_Statement.wav",
      lines: [
        ""I saw a man in the alley,"",
        ""He was holding something that caught the light."",
        ""It never rained that day."",
        ""The time was around three.""
      ],
      clue: "Clue C: The witness remembers it never rained that day, and sees a man holding something reflective."
    }
  ],
  ending: [
    "> All audio fragments restored.",
    "> Cross reference complete.",
    "> Primary suspect identified: REPORTER_AIDEN.",
    "> Case File: CLOSED."
  ]
};

/* =========================
   STATE
========================= */
const state = {
  listened: new Set(),
  current: null,
  typing: {skippable:false, skipping:false}
};

/* =========================
   HELPERS
========================= */
const $ = sel => document.querySelector(sel);
const app = $("#app");
const overlayEnding = $("#ending");
const endingBox = $("#endingBox");
const overlayAccuse = $("#accuseOverlay");
const accuseHint = $("#accuseHint");
const accessing = $("#accessing");

function showAccessing(msg){
  accessing.textContent = msg || DATA.ui.accessing;
  accessing.classList.add("active");
}
function hideAccessing(){ accessing.classList.remove("active"); }

function allListened(){
  return DATA.files.every(f => state.listened.has(f.id));
}

function resetScroll(){ window.scrollTo({top:0}); }

/* =========================
   RENDER — LIST
========================= */
function renderList(){
  state.current = null;

  const cluesHTML = DATA.files
    .filter(f => state.listened.has(f.id))
    .map(f => `<div class="clue-item">- ${f.clue}</div>`)
    .join("");

  const accuseButton = allListened()
    ? `<div class="btn-row">
         <button class="btn mono" id="accuseBtn">Accuse suspect</button>
       </div>
       <div class="msg">You have unlocked all clues. Use them to decide who is responsible.</div>`
    : `<div class="msg">Collect more clues before you accuse anyone.</div>`;

  app.innerHTML = `
    <div class="hdr mono">
      > ${DATA.ui.title}\n> ${DATA.ui.subtitle}\n> ${DATA.ui.status}
    </div>
    <div class="mono">${DATA.ui.prompt}</div>
    <div class="mono">${DATA.ui.select}</div>
    <ul class="files" id="fileList">
      ${DATA.files.map(f=>{
        const tick = state.listened.has(f.id) ? ' <span class="status">✓</span>' : '';
        return `<li class="file" data-id="${f.id}" tabindex="0">
                  <span class="tag">[${f.id}]</span>
                  <span class="name">${f.name}</span>
                  ${tick}
                </li>`;
      }).join("")}
    </ul>
    <div class="help mono">• ${DATA.ui.help}</div>
    <div class="footer">Press <span class="kbd">Enter</span> to open selected file · <span class="kbd">Esc</span> to return</div>

    <div class="clues mono">
      <div class="clues-title">Unlocked clues:</div>
      ${cluesHTML || '<div class="clue-item muted">No clues yet. Listen to the logs.</div>'}
      ${accuseButton}
    </div>
  `;
  bindListEvents();
  bindAccuseButton();
}

function bindListEvents(){
  const list = $("#fileList");
  list.addEventListener("click", (e)=>{
    const li = e.target.closest(".file");
    if(!li) return;
    openFile(li.dataset.id);
  });
  list.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      const li = e.target.closest(".file");
      if(li) openFile(li.dataset.id);
    }
  });
}

function bindAccuseButton(){
  const btn = $("#accuseBtn");
  if(!btn) return;
  btn.addEventListener("click", ()=>{
    accuseHint.textContent = "";
    overlayAccuse.classList.add("show");
  });
}

/* =========================
   RENDER — PLAYER
========================= */
function openFile(id){
  const file = DATA.files.find(f=>f.id===id);
  if(!file) return;
  showAccessing();
  setTimeout(()=>{
    hideAccessing();
    state.current = id;
    state.typing.skipping = false;
    app.innerHTML = `
      <div class="hdr mono">> ${DATA.ui.title}\n> ${DATA.ui.subtitle}\n> FILE: [${file.id}] ${file.name}</div>
      <div class="log-title mono">Playback (click text to skip typing)<span class="blink"></span></div>
      <div class="log-lines mono" id="logBox" tabindex="0" aria-live="polite"></div>
      <button class="btn mono" id="backBtn">${DATA.ui.back}</button>
    `;
    typeLines(file.lines, $("#logBox")).then(()=>{
      state.listened.add(file.id);
      $("#backBtn")?.focus();
    });
    $("#backBtn").addEventListener("click", ()=> { renderList(); resetScroll(); });
    document.onkeydown = (ev)=>{
      if(ev.key === "Escape"){ renderList(); resetScroll(); }
    };
  }, 600);
}

/* typing animation with skip */
function typeLines(lines, container){
  return new Promise(async (resolve)=>{
    state.typing.skippable = true;
    state.typing.skipping = false;

    function typeLine(text){
      return new Promise(res=>{
        let i=0;
        const span = document.createElement("div");
        container.appendChild(span);
        const speed = 18;
        const timer = setInterval(()=>{
          if(state.typing.skipping){
            span.textContent = text;
            clearInterval(timer); res();
            return;
          }
          span.textContent = text.slice(0, ++i);
          if(i>=text.length){ clearInterval(timer); res(); }
        }, speed);
      });
    }

    container.addEventListener("click", ()=>{
      if(state.typing.skippable){
        state.typing.skipping = true;
      }
    }, {once:false});

    for(const line of lines){
      if(state.typing.skipping){
        const d = document.createElement("div");
        d.textContent = line;
        container.appendChild(d);
      }else{
        await typeLine(line);
        await new Promise(r=>setTimeout(r, 140));
      }
    }

    state.typing.skippable = false;
    const end = document.createElement("div");
    end.innerHTML = '<span class="blink"></span>';
    container.appendChild(end);

    resolve();
  });
}

/* =========================
   ENDING & ACCUSE
========================= */
function showEnding(){
  endingBox.innerHTML = DATA.ending.map(l=>`${l}`).join("\n");
  overlayEnding.classList.add("show");
}
overlayEnding.addEventListener("click", ()=> overlayEnding.classList.remove("show"));

overlayAccuse.addEventListener("click",(e)=>{
  if(e.target === overlayAccuse){ overlayAccuse.classList.remove("show"); }
});
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){
    overlayEnding.classList.remove("show");
    overlayAccuse.classList.remove("show");
  }
});

$("#accuseReporter").addEventListener("click", ()=>{
  overlayAccuse.classList.remove("show");
  showEnding();
});
$("#accuseUnknown").addEventListener("click", ()=>{
  accuseHint.textContent = "System hint: time, weather and scene all contradict the reporter's story. Check the three logs again.";
});

/* =========================
   INIT
========================= */
renderList();
</script>
</body>
</html>
